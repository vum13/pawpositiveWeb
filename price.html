<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pawsitive Pet Academy - Pricing</title>
</head>
<body>
    <header>
        <div>
            <img src="Paws-removebg-preview.png" alt="Pawsitive Pet Academy Logo" width="150" height="150">
        </div>
        <nav>
            <ul>
                <li><a href="about.html">About us</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Your Details</h2>
            <form>
                <div>
                    <label for="fullName">Full Name</label><br>
                    <input type="text" id="fullName" name="fullName">
                </div>
                <div>
                    <label for="phoneNumber">Phone Number</label><br>
                    <input type="tel" id="phoneNumber" name="phoneNumber">
                </div>
                <div>
                    <label for="emailAddress">Email Address</label><br>
                    <input type="email" id="emailAddress" name="emailAddress">
                </div>
            </form>

            <h2>Your Quote</h2>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>items</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                       
                    </tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Select course</h2>

            <h3>6 weeks</h3>
            <form>
                <div>
                    <input type="checkbox" id="basicDogWalk" name="course" value="750">
                    <label for="basicDogWalk">Basic Dog walk</label>
                </div>
                <div>
                    <input type="checkbox" id="puppyCare" name="course" value="750">
                    <label for="puppyCare">Puppy care</label>
                </div>
                <div>
                    <input type="checkbox" id="petFirstAid" name="course" value="750">
                    <label for="petFirstAid">Pet first Aid</label>
                </div>
            </form>

            <h3>6 months</h3>
            <form>
                <div>
                    <input type="checkbox" id="petBusinessManagement" name="course" value="1500">
                    <label for="petBusinessManagement">Pet business management</label>
                </div>
                <div>
                    <input type="checkbox" id="animalBehaviour" name="course" value="1500">
                    <label for="animalBehaviour">Animal behaviour</label>
                </div>
                <div>
                    <input type="checkbox" id="petGromming" name="course" value="1500">
                    <label for="petGromming">Pet gromming</label>
                </div>
                <div>
                    <input type="checkbox" id="canineObedienceTraining" name="course" value="1500">
                    <label for="canineObedienceTraining">Canine obedience training</label>
                </div>
            </form>

            <div>
                <h3>Subtotal:</h3>
                <h3>Discount:</h3>
            </div>
        </section>
    </main>
</body>
</html>
