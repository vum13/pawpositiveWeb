<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Pawsitive Pet Academy</title>
  
  <style>
    :root {
      --gold: #ebd469;
      --pink: #f5c8c2;
      --rose: #f8eae1;
      --cream-light: #fef8f3;
      --cream: #fff6e9;
      --blue: #8de4ff;
      --purple: #a379c9;
      --footer-bg: #4a3525;
      --text-dark: #333333;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--cream-light);
      /* Setting the background pattern provided */
      background-image: url('backgroung pic.jpeg'); 
      background-size: cover;
      background-attachment: fixed;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header Styling */
    header {
      
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
     
      flex-wrap: wrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    header img {
      border-radius: 8px;
      height: 150px;
      width: 150px;
    }

    nav {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 6px 12px;
      border-radius: 20px;
      transition: all 0.2s ease-in-out;
    }

    nav a:hover {
      background-color: var(--gold);
      color: #000;
    }

    /* Main Section Styling */
    main {
      flex: 1;
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: #2b2b2b;
    }

    /* Gallery Grid Layout matching screenshot */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .gallery-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      justify-items: center;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      width: 100%;
      max-width: 220px;
    }

    .gallery-item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(163, 121, 201, 0.3);
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    /* Interactive Lightbox / Modal Overlay */
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      flex-direction: column;
    }

    #lightbox img {
      max-width: 80%;
      max-height: 70vh;
      border-radius: 8px;
      border: 4px solid var(--cream);
    }

    #lightbox p {
      color: white;
      margin-top: 15px;
      font-size: 1.2rem;
      font-weight: 500;
    }

    #lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 2rem;
      color: white;
      cursor: pointer;
    }

    /* Footer Styling */
    footer {
      background-color: var(--footer-bg);
      color: white;
      padding: 30px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: auto;
    }

    footer img {
      height: 200px;
      width: 200px;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    footer a:hover {
      color: var(--gold);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .gallery-row {
        grid-template-columns: 1fr;
      }
      header {
        flex-direction: column;
        align-items: center;
      }
      nav {
        justify-content: center;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <img src="Paws-removebg-preview.png" alt="Pawsitive Pet Academy Logo" width="120" height="80">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="courses.html">Courses</a>
      <a href="pricing.html">Pricing</a>
      <a href="blog.html">Blog</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html" style="background-color: var(--gold);">Gallery</a>
      <a href="reviews.html">Reviews</a>
      <a href="cart.html">Cart</a>
      <a href="team.html">Our Team</a>
      <a href="contact.html">Contact Details</a>
    </nav>
  </header>

  <!-- Main Content Grid -->
  <main>
    <section>
      <h2>Explore the fun had learning</h2>
      
      <div class="gallery-container">
        <!-- Row 1 -->
        <div class="gallery-row">
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\standing bunny.jpeg" alt="Bunny eating a carrot">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\rabbiteating.jpeg" alt="Bunny from behind">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\goldlad.jpeg" alt="Puppy">
          </div>
        </div>

        <!-- Row 2 -->
        <div class="gallery-row">
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\sassydog.jpeg" alt="Dog upside down">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\hamster.jpeg" alt="Hamster">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\lizerd.jpeg" alt="Gecko">
          </div>
        </div>

        <!-- Row 3 -->
        <div class="gallery-row">
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\sharkcat.jpeg" alt="Cat in shark costume">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\pointypet.jpeg" alt="Hedgehog">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\babylab.jpeg" alt="Golden retriever">
          </div>
        </div>

        <!-- Row 4 -->
        <div class="gallery-row">
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\redcapdog.jpeg" alt="Red cap dog">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\bird.jpeg" alt="Cockatiel">
          </div>
          <div class="gallery-item" onclick="openLightbox(this)">
            <img src="images\dinodog.jpeg" alt="Dog in dinosaur costume">
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Lightbox Modal Container -->
  <div id="lightbox" onclick="closeLightbox()">
    <span id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Zoomed Pet">
    <p id="lightbox-caption"></p>
  </div>

  <!-- Footer Section -->
  <footer>
    <img src="images\second_paw_logo-removebg-preview.png" alt="Pawsitive Pet Academy Logo">
    <nav style="display: flex; gap: 10px; flex-wrap: wrap;">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="courses.html">Courses</a>
      <a href="pricing.html">Pricing</a>
      <a href="blog.html">Blog</a>
      <a href="gallery.html">Gallery</a>
      <a href="shop.html">Shop</a>
      <a href="reviews.html">Reviews</a>
      <a href="cart.html">Cart</a>
      <a href="team.html">Our Team</a>
      <a href="contact.html">Contact Details</a>
    </nav>
  </footer>

  <!-- JavaScript for Interactive Gallery Lightbox -->
  <script>
    function openLightbox(element) {
      const img = element.querySelector('img');
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');

      lightboxImg.src = img.src;
      lightboxCaption.textContent = img.alt;
      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      lightbox.style.display = 'none';
    }

    // Optional: Close lightbox with Escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === "Escape") {
        closeLightbox();
      }
    });
  </script>

</body>
</html>
